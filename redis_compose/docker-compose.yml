version: '3.8'

services:
  redis:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    environment:
      - REDIS_ARGS=--requirepass tuntun123  # Optional: sets the password
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
